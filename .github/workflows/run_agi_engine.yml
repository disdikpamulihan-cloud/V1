name: AGI Engine High-Grade Automation

on:
  schedule:
    - cron: '0 * * * 1-5'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Trading Symbol'
        required: true
        default: 'XAUUSD'
      signal:
        description: 'Signal Direction (AUTO = Bot pilih sendiri)'
        required: true
        type: choice
        options:
          - AUTO
          - BUY
          - SELL
        default: 'AUTO'

jobs:
  run-agi-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache SQLite & State Memory
        uses: actions/cache@v4
        with:
          path: .state_cache
          key: state-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            state-cache-${{ runner.os }}-

      - name: Run Manual / Auto OP Signal Filter
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run.py \
            --symbol "${{ github.event.inputs.symbol }}" \
            --signal "${{ github.event.inputs.signal }}" \
            --source "GitHub-Workflow"

      - name: Run Scheduled Scan
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run.py --symbol "XAUUSD" --signal "AUTO" --source "GitHub-Cron"
