name: 🚀 Run AGI God-Tier Bot

on:
  workflow_dispatch: # Bisa dipanggil manual dari tab Actions
  schedule:
    - cron: '0 */2 * * *' # Jalan otomatis tiap 2 jam

jobs:
  run-god-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Cache AGI State (Memory & ML)
        uses: actions/cache@v4
        with:
          path: .state_cache
          key: god-agi-state-v3-${{ runner.os }}
          restore-keys: god-agi-state-v3-
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Execute God-Tier Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
